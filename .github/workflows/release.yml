# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    tags:        
      - '*'

jobs:

  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev gcc-mingw-w64 libx11-dev libxcursor-dev libxrandr-dev libinerama-dev libxi-dev libxxf86vm-dev

    - name: Linux build
      run: go build -v -ldflags "-s -w" -o hasherino-linux

    - name: Windows build
      run: |
        export GOOS=windows
        export GOARCH=amd64
        # Turn off CGO for the Windows cross-compile unless you have manually configured an external Windows SDK matrix.
        # Fyne applications cross-compiling via MinGW need CGO_ENABLED=0 to avoid looking for missing local Windows .dll headers on Linux.
        export CGO_ENABLED=0 
        go build -v -ldflags "-s -w" -o hasherino-windows.exe

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hasherino
        path: |
          hasherino-linux
          hasherino-windows.exe

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Download artifacts
      # 6. Aligned the download artifact action with the v4 version pattern
      uses: actions/download-artifact@v4
      with:
        name: hasherino
        path: artifacts
    
    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
        body_path: CHANGELOG.md
        files: |
          artifacts/*

