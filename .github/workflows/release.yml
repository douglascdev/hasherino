name: Build

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Flatpak)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # flatpak-builder needs unprivileged user namespaces on Ubuntu 24.04.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Build Flatpak
        run: nix develop -c ./scripts/build-flatpak.sh

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: hasherino-linux
          path: com.hashysoftware.hasherino.flatpak
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build Windows executable
        run: nix develop .#windows -c ./scripts/build-windows.sh

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: hasherino-windows
          path: dist/hasherino-windows-amd64.exe
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The Android SDK/NDK and the Nix store need room on the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune -af || true

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build Android APK
        run: nix develop .#android -c ./scripts/build-android.sh

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: hasherino-android
          path: dist/hasherino-android.apk
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [linux, windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: clean-dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: CHANGELOG.md
          files: clean-dist/*
